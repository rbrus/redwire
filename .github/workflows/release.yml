name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, out: redwire-linux-amd64 }
          - { goos: linux,   goarch: arm64, out: redwire-linux-arm64 }
          - { goos: darwin,  goarch: amd64, out: redwire-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, out: redwire-darwin-arm64 }
          - { goos: windows, goarch: amd64, out: redwire-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w -X main.buildVersion=${GITHUB_REF_NAME}" \
            -o "build/${{ matrix.out }}" ./cmd/redwire
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: build/${{ matrix.out }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes \
            dist/*
